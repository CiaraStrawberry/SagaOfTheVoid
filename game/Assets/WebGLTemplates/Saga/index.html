<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
<title>Saga of the Void</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico">
<style>
/* Full-window game page: the canvas fills the browser; a loading screen sits on top until the game is ready. */
:root {
  --void: #05070c; --text: #dfe5ef; --muted: #8d98ab; --signal: #6fb6ff; --line: #283246;
  --f-display: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --f-body: "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--void); color: var(--text); font-family: var(--f-body); }
#unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: var(--void); outline: none; }

#loader {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
  background:
    radial-gradient(1px 1px at 12% 22%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 78% 14%, #fff6 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 64% 68%, #fff7 50%, transparent 51%), radial-gradient(1px 1px at 30% 80%, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 52%, #fff6 50%, transparent 51%), radial-gradient(1.5px 1.5px at 46% 36%, #fff4 50%, transparent 51%),
    radial-gradient(1px 1px at 8% 64%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 56% 8%, #fff6 50%, transparent 51%),
    radial-gradient(ellipse 70% 55% at 70% 40%, #1b2a4a66, transparent 70%),
    radial-gradient(ellipse 60% 50% at 20% 75%, #3a1e3a44, transparent 70%),
    var(--void);
  transition: opacity .8s ease;
}
#loader.done { opacity: 0; pointer-events: none; }
.card { display: grid; gap: 22px; justify-items: center; text-align: center; padding: 0 24px; }
h1 { margin: 0; font: 600 clamp(34px, 6vw, 72px)/1.05 var(--f-display); letter-spacing: .08em; text-transform: uppercase;
     text-shadow: 0 0 30px #6fb6ff55; }
.sub { color: var(--muted); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
.bar { width: min(420px, 70vw); height: 4px; background: #ffffff14; border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3d7fd6, var(--signal)); box-shadow: 0 0 12px var(--signal); transition: width .2s ease; }
.status { color: var(--muted); font-size: 13px; min-height: 1.4em; font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 13px; max-width: 460px; line-height: 1.6; opacity: .8; }
.error { color: #ff8a80; }

#fullscreen {
  position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; width: 36px; height: 36px; border-radius: 6px;
  border: 1px solid var(--line); background: #0d1220cc; color: var(--text); cursor: pointer; display: grid; place-items: center;
  opacity: .55; transition: opacity .2s;
}
#fullscreen:hover, #fullscreen:focus-visible { opacity: 1; }
#fullscreen svg { width: 18px; height: 18px; }
#banner { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 20; display: grid; gap: 6px; }
#banner div { background: #2a1416ee; border: 1px solid #ff8a8066; color: #ffd0cc; padding: 8px 14px; border-radius: 6px; font-size: 13px; }
#banner div.warn { background: #2a2414ee; border-color: #e7b04c66; color: #f3dfb0; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>

<div id="loader" role="status" aria-live="polite">
  <div class="card">
    <h1>Saga of the Void</h1>
    <div class="sub">Remake preview</div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="status" id="status">Loading…</div>
    <div class="hint">Best with a mouse and keyboard. Left-click selects, right-click gives orders, H shows all controls.</div>
  </div>
</div>

<button id="fullscreen" title="Full screen" aria-label="Full screen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="banner"></div>

<script>
  var canvas = document.querySelector("#unity-canvas");
  var bar = document.querySelector("#bar");
  var statusEl = document.querySelector("#status");
  var loader = document.querySelector("#loader");

  // Right-click is a game command (move / attack), so the browser's menu must not appear.
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  // Keep the page itself from scrolling with the wheel or arrow keys.
  window.addEventListener("keydown", function (e) {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.key) >= 0 && e.target === document.body) e.preventDefault();
  });
  // Game shortcuts the browser would otherwise take: Ctrl+1..9 (save a control group; the browser switches tabs)
  // and Ctrl+A (select every ship; the browser selects the page's text). Runs first, and the game still gets the key.
  window.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && /^(Digit[1-9]|Numpad[1-9]|KeyA)$/.test(e.code)) e.preventDefault();
  }, true);

  function unityShowBanner(msg, type) {
    var div = document.createElement("div");
    div.textContent = msg;
    if (type === "warning") div.className = "warn";
    document.querySelector("#banner").appendChild(div);
    if (type !== "error") setTimeout(function () { div.remove(); }, 6000);
  }

  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
  var config = {
    arguments: [],
    dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
    frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
    workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
    codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
    symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
    streamingAssetsUrl: "StreamingAssets",
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    showBanner: unityShowBanner,
  };

  var instance = null;
  document.querySelector("#fullscreen").addEventListener("click", function () {
    if (instance) instance.SetFullscreen(1);
    canvas.focus();
  });

  var script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      bar.style.width = Math.round(100 * progress) + "%";
      statusEl.textContent = progress < 0.9 ? "Loading… " + Math.round(100 * progress) + "%" : "Starting…";
    }).then(function (unityInstance) {
      instance = unityInstance;
      loader.classList.add("done");
      canvas.focus();
    }).catch(function (message) {
      statusEl.textContent = String(message);
      statusEl.className = "status error";
    });
  };
  script.onerror = function () {
    statusEl.textContent = "Couldn't load the game files. Open this page through a web server (python tools/serve_web.py), not from disk.";
    statusEl.className = "status error";
  };
  document.body.appendChild(script);
</script>
</body>
</html>
